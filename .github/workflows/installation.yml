name: Installation compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'skills/shellferry/SKILL.md'
      - 'tools/package.py'
      - 'tools/check_installation.py'
      - '.github/workflows/installation.yml'
permissions:
  contents: read
jobs:
  skills-cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python tools/package.py
      - run: python tools/check_installation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ matrix.os }}
          path: dist/installation-checks.json
