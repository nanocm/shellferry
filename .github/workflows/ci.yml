name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate repository
        run: python tools/check_repo.py
      - name: Run offline unit tests
        run: python tools/run_tests.py
      - name: Check verified coverage
        run: python tools/coverage.py --check --minimum 105
      - name: Build release package
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: shellferry-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
